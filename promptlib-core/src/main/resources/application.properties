# ---------------------------------------------------------------------------
# core — gRPC face, MySQL, Flyway, Keycloak Admin API (registration only)
# ---------------------------------------------------------------------------
quarkus.application.name=promptlib-core

# gRPC on 9000, health/metrics HTTP on 9001. Never expose either port publicly.
quarkus.http.port=9001
quarkus.grpc.server.port=9000
quarkus.grpc.server.use-separate-server=true

# --- MySQL ---------------------------------------------------------------
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USER:promptlib}
quarkus.datasource.password=${DB_PASSWORD:promptlib}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/promptlib?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&characterEncoding=utf8}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=15
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.jdbc.idle-removal-interval=5M
quarkus.datasource.jdbc.max-lifetime=30M

# --- Schema ownership ----------------------------------------------------
# Flyway is the only writer of DDL. Hibernate validates, never generates.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.baseline-on-migrate=false
quarkus.flyway.validate-on-migrate=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.hibernate-orm.log.sql=false
# JSON columns use Hibernate's own mapper, not Quarkus' REST-tuned ObjectMapper.
quarkus.hibernate-orm.mapping.format.global=ignore

# --- Keycloak Admin REST API (registration endpoint only) ----------------
# client_credentials token for the promptlib-register service account.
quarkus.oidc-client.keycloak-admin.auth-server-url=${KC_URL:http://localhost:8180}/realms/promptlib
quarkus.oidc-client.keycloak-admin.client-id=promptlib-register
quarkus.oidc-client.keycloak-admin.credentials.secret=${KC_REGISTER_CLIENT_SECRET:change-me}
quarkus.oidc-client.keycloak-admin.grant.type=client
# No health probe at startup: Keycloak is often not running in dev/test.
quarkus.oidc-client.health.enabled=false
quarkus.rest-client.keycloak-admin.url=${KC_URL:http://localhost:8180}

# --- Application settings ------------------------------------------------
promptlib.export.batch-size=100

# --- Logging (see docs/architecture/06-logging.md) ------------------------
quarkus.log.level=INFO
quarkus.log.category."com.promptlib".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{2.}] (%t) rid=%X{requestId} %s%e%n
quarkus.log.file.enable=true
quarkus.log.file.path=${LOG_DIR:logs}/promptlib-core.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{2.}] (%t) rid=%X{requestId} uid=%X{userId} %s%e%n
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=10
quarkus.log.file.rotation.rotate-on-boot=true
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.file.async.enabled=true
quarkus.log.file.async.queue-length=1024
quarkus.log.file.async.overflow=block
%prod.quarkus.log.category."com.promptlib".level=INFO

# --- Tests ---------------------------------------------------------------
%test.quarkus.datasource.db-kind=mysql
%test.quarkus.datasource.jdbc.url=${TEST_DB_URL:}
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.log.file.enable=false
%test.quarkus.log.category."com.promptlib".level=INFO

# No Docker on the dev host; use the real Keycloak when it exists.
quarkus.keycloak.devservices.enabled=false



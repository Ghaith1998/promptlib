# ---------------------------------------------------------------------------
# edge — the only public surface: REST, OIDC, OpenAPI, gRPC clients
# ---------------------------------------------------------------------------
quarkus.application.name=promptlib-edge
quarkus.http.port=8080

# --- OIDC resource server ------------------------------------------------
quarkus.oidc.auth-server-url=${OIDC_URL:http://localhost:8180/realms/promptlib}
quarkus.oidc.client-id=promptlib-edge
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=promptlib-edge
quarkus.oidc.connection-timeout=2S
quarkus.oidc.health.enabled=true

# --- gRPC client to core -------------------------------------------------
# `core` resolves through compose DNS in production; localhost in dev.
quarkus.grpc.clients.core.host=${CORE_HOST:localhost}
quarkus.grpc.clients.core.port=${CORE_PORT:9000}
quarkus.grpc.clients.core.plain-text=true

# --- HTTP surface --------------------------------------------------------
# No browser client in v1 (ADR-21): CORS stays off.
quarkus.http.cors.enabled=false
quarkus.smallrye-openapi.info-title=Prompt Library API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.security-scheme=oidc
quarkus.smallrye-openapi.security-scheme-name=keycloak
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.always-include=false

# --- Logging (see docs/architecture/06-logging.md) ------------------------
quarkus.log.level=INFO
quarkus.log.category."com.promptlib".level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{2.}] (%t) rid=%X{requestId} %s%e%n
quarkus.log.file.enable=true
quarkus.log.file.path=${LOG_DIR:logs}/promptlib-edge.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{2.}] (%t) rid=%X{requestId} uid=%X{userId} %s%e%n
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=10
quarkus.log.file.rotation.rotate-on-boot=true
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd
quarkus.log.file.async.enabled=true
quarkus.log.file.async.queue-length=1024
quarkus.log.file.async.overflow=block
%dev.quarkus.log.category."com.promptlib".level=DEBUG

# --- Tests ---------------------------------------------------------------
%test.quarkus.oidc.enabled=false
%test.quarkus.log.file.enable=false
%test.quarkus.grpc.clients.core.host=localhost
%test.quarkus.grpc.clients.core.port=9001

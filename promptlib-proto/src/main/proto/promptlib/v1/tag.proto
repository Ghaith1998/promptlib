syntax = "proto3";
package promptlib.v1;
option java_package = "com.promptlib.proto.v1";
option java_multiple_files = true;
option java_outer_classname = "TagProto";
import "promptlib/v1/common.proto";

service TagService {
  rpc List (Empty) returns (ListTagsReply);
  rpc SetForPrompt (SetTagsRequest) returns (ListTagsReply);
  rpc Delete (TagRef) returns (Empty);
}

message TagRef {
  string tag_id = 1;
}

message ListTagsReply {
  repeated TagReply items = 1;
}

message TagReply {
  string id = 1;
  string name = 2;
  string color = 3;
}

message SetTagsRequest {
  string prompt_id = 1;
  repeated string names = 2;
}

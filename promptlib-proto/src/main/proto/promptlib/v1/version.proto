syntax = "proto3";
package promptlib.v1;
option java_package = "com.promptlib.proto.v1";
option java_multiple_files = true;
option java_outer_classname = "VersionProto";
import "promptlib/v1/common.proto";
import "promptlib/v1/prompt.proto";

service VersionService {
  rpc List (ListVersionsRequest) returns (ListVersionsReply);
  rpc Get (GetVersionRequest) returns (VersionReply);
  rpc Create (CreateVersionRequest) returns (VersionSummaryReply);
  rpc Publish (PublishVersionRequest) returns (PromptReply);
  rpc Unpublish (GetPromptRequest) returns (PromptReply);
}

message ListVersionsRequest {
  string prompt_id = 1;
}

message ListVersionsReply {
  repeated VersionSummaryReply items = 1;
}

message GetVersionRequest {
  string prompt_id = 1;
  int32 version_number = 2;
}

message CreateVersionRequest {
  string prompt_id = 1;
  string change_note = 2;
  repeated MessageInput messages = 3;
  repeated VariableInput variables = 4;
}

message PublishVersionRequest {
  string prompt_id = 1;
  int32 version_number = 2;
  string category_id = 3;
}

message VersionSummaryReply {
  string id = 1;
  int32 version_number = 2;
  string change_note = 3;
  string created_at = 4;
}

message VersionReply {
  string id = 1;
  string prompt_id = 2;
  int32 version_number = 3;
  string change_note = 4;
  string created_at = 5;
  repeated MessageReply messages = 6;
  repeated VariableReply variables = 7;
}

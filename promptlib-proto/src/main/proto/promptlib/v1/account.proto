syntax = "proto3";
package promptlib.v1;
option java_package = "com.promptlib.proto.v1";
option java_multiple_files = true;
option java_outer_classname = "AccountProto";
import "promptlib/v1/common.proto";

service AccountService {
  rpc EnsureUser (EnsureUserRequest) returns (UserReply);
  rpc GetMe (Empty) returns (UserReply);
  rpc UpdateProfile (UpdateProfileRequest) returns (UserReply);
  rpc Register (RegisterRequest) returns (UserReply);
}

message EnsureUserRequest {
  string sub = 1;
  string username = 2;
  string email = 3;
  repeated string roles = 4;
}

message UpdateProfileRequest {
  string display_name = 1;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string display_name = 4;
}

message UserReply {
  string id = 1;
  string username = 2;
  string email = 3;
  string display_name = 4;
  repeated string roles = 5;
}

syntax = "proto3";
package promptlib.v1;
option java_package = "com.promptlib.proto.v1";
option java_multiple_files = true;
option java_outer_classname = "ExportProto";
import "promptlib/v1/common.proto";

service ExportService {
  rpc ExportLibrary (Empty) returns (stream ExportChunk);
  rpc ExportMarkdown (ExportPromptRef) returns (stream ExportChunk);
}

message ExportPromptRef {
  string prompt_id = 1;
}

message ExportChunk {
  string data = 1;
}
